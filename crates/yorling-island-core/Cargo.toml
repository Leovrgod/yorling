[package]
name = "yorling-island-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "fs", "time"] }
async-trait = "0.1"
dashmap = "6"
tracing = "0.1"
thiserror = "2"
anyhow = "1"
dirs = "6"
time = { version = "0.3", features = ["parsing", "formatting"] }
