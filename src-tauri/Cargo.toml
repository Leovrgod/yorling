[package]
name = "yorling"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "yorling_app"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"

yorling-core = { path = "../crates/yorling-core" }
yorling-engine = { path = "../crates/yorling-engine" }
yorling-island-core = { path = "../crates/yorling-island-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
dirs = "6"
libc = "0.2"
url = "2.5.8"

[dev-dependencies]
anyhow = "1"
async-trait = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
yorling-platform-macos = { path = "../crates/yorling-platform-macos" }
block2 = "0.6.2"
core-graphics = "0.25.0"
objc2-app-kit = { version = "0.3.2", features = ["block2"] }
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
png = "0.18.1"
rusqlite = "0.31"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2.10.1"
